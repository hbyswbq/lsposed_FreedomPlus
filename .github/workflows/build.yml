name: Build APK (Stable Rewrite)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 完全重写根 build.gradle（兼容 Gradle 8.7）
    - name: Rewrite root build.gradle
      run: |
        cat > build.gradle << 'EOF'
        // Top-level build file
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.5.0'
            }
        }

        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }

        tasks.register('clean', Delete) {
            delete rootProject.buildDir
        }
        EOF

    # 确保 settings.gradle 包含 app 和 ktutils
    - name: Rewrite settings.gradle
      run: |
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "FreedomPlus"
        include ':app', ':ktutils'
        EOF

    # 重写 ktutils/build.gradle 为标准 Android 库
    - name: Rewrite ktutils/build.gradle
      run: |
        mkdir -p ktutils
        cat > ktutils/build.gradle << 'EOF'
        apply plugin: 'com.android.library'

        android {
            compileSdk 34

            defaultConfig {
                minSdk 26
                targetSdk 34
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
                debug {
                    // default
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            // 若有项目原有依赖，可在此添加；否则留空
        }
        EOF

    # 可选：保留 app/build.gradle 不变，但若它依赖 ktutils 模块，上述修改已足够
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Attach to Release (if triggered)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
