name: Build APK (Auto-fix ktutils)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 修复 ktutils 模块（如果缺失或配置错误）
    - name: Fix ktutils build.gradle
      run: |
        mkdir -p ktutils
        cat > ktutils/build.gradle << 'EOF'
        apply plugin: 'com.android.library'

        android {
            compileSdk 34

            defaultConfig {
                minSdk 26
                targetSdk 34
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
                debug {
                    // 无需额外配置
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            // 如果有原有依赖，可在此添加；若无，保持空
        }
        EOF

    # 确保根目录 build.gradle 使用正确的 AGP 版本（8.5.0）
    - name: Align AGP version in root build.gradle
      run: |
        if grep -q "classpath 'com.android.tools.build:gradle:" build.gradle; then
          sed -i "s/classpath 'com.android.tools.build:gradle:.*'/classpath 'com.android.tools.build:gradle:8.5.0'/" build.gradle
        else
          # 如果不存在，则插入到 buildscript 块中（简单处理）
          echo "buildscript {
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.0'
              }
          }" >> build.gradle
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Attach to Release (if triggered by release)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
